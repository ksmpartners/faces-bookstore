# must include web.xml and faces-config.xml to be parsed.
quarkus.native.resources.includes=META-INF/*.xml,*.properties,*.png
# default bean validation locale
quarkus.default-locale=en
quarkus.http.port=8080
quarkus.http.compressors=deflate,gzip,br
quarkus.http.access-log.enabled=false
quarkus.http.enable-compression=true
quarkus.servlet.direct-buffers=true
quarkus.servlet.buffer-size=640000
# improve hot reloading performance
%dev.quarkus.live-reload.instrumentation=true
# uber jar creation to create a single executable jar
#quarkus.package.jar.type=uber-jar

# ==============================================================================
# Logging (JBoss Logging - org.jboss.logging.Logger)
# ==============================================================================
quarkus.log.level=INFO
quarkus.log.category."com.ksm".level=INFO
%dev.quarkus.log.category."com.ksm".level=DEBUG
%test.quarkus.log.category."com.ksm".level=DEBUG

# ==============================================================================
# Datasource / JPA - H2 in-memory database with the BOOKSTORE schema
# ==============================================================================
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:bookstore;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS BOOKSTORE
quarkus.datasource.username=sa
quarkus.datasource.password=sa
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.sql-load-script=import.sql
%dev.quarkus.hibernate-orm.log.sql=true

# ==============================================================================
# Security - FORM login against embedded users
# ==============================================================================
quarkus.http.auth.form.enabled=true
quarkus.http.auth.form.login-page=/pages/login/login.xhtml
quarkus.http.auth.form.error-page=/pages/login/login-error.xhtml
quarkus.http.auth.form.landing-page=/pages/public/home.xhtml
quarkus.http.auth.permission.admin.paths=/pages/admin/*
quarkus.http.auth.permission.admin.policy=admin
quarkus.http.auth.policy.admin.roles-allowed=Admin
quarkus.http.auth.permission.secure.paths=/pages/secure/*
quarkus.http.auth.permission.secure.policy=general
quarkus.http.auth.policy.general.roles-allowed=General
# training users: admin/admin (Admin, General) and user/user (General)
quarkus.security.users.embedded.enabled=true
quarkus.security.users.embedded.plain-text=true
quarkus.security.users.embedded.users.admin=admin
quarkus.security.users.embedded.roles.admin=Admin,General
quarkus.security.users.embedded.users.user=user
quarkus.security.users.embedded.roles.user=General
